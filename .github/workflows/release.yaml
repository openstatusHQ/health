name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 24
          cache: true
      - name: Tag matches every manifest
        run: vp run check:versions "$GITHUB_REF_NAME"
      - run: vp run test-all
      - run: vp pm pack -r --pack-destination "$RUNNER_TEMP/tarballs" -- --ignore-scripts

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 24
          cache: true
      - run: vp run build
      - name: Use NPM_TOKEN when set, otherwise npm trusted publishing (OIDC)
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      # Publishes in dependency order (@openstatus/health first) and skips
      # versions that are already on npm, so a failed run can be re-run.
      - run: vp pm publish -r --access public --no-git-checks --provenance -- --ignore-scripts
